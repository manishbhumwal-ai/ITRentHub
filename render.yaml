services:
  - type: web
    name: itrenthub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: SESSION_SECRET
        generateValue: true

      - key: DATA_DIR
        value: /var/data

      - key: GMAIL_USER
        sync: false

      - key: GMAIL_APP_PASSWORD
        sync: false

      - key: ADMIN_EMAIL
        sync: false
